<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doraemon Animation 💙</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  background: linear-gradient(#74d7ff, #dff8ff);
  font-family: Arial, sans-serif;
}

/* Clouds */
.cloud {
  position: absolute;
  background: white;
  width: 120px;
  height: 45px;
  border-radius: 50px;
  opacity: .8;
  animation: moveCloud 15s linear infinite;
}

.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  background: white;
  border-radius: 50%;
}

.cloud::before {
  width: 60px;
  height: 60px;
  left: 20px;
  top: -30px;
}

.cloud::after {
  width: 70px;
  height: 70px;
  right: 15px;
  top: -35px;
}

.cloud1 {
  top: 15%;
  left: -150px;
}

.cloud2 {
  top: 30%;
  left: -300px;
  animation-delay: 5s;
}

@keyframes moveCloud {
  to {
    transform: translateX(120vw);
  }
}

/* Ground */
.ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 100px;
  background: #65c466;
}

/* Doraemon */
.doraemon {
  position: absolute;
  left: 50%;
  bottom: 90px;
  transform: translateX(-50%);
  width: 260px;
  height: 330px;
  animation: bounce 2s infinite;
}

/* Head */
.head {
  position: absolute;
  width: 250px;
  height: 235px;
  background: #159bd3;
  border-radius: 50%;
  border: 4px solid #111;
  z-index: 2;
}

/* Face */
.face {
  position: absolute;
  left: 20px;
  bottom: 0;
  width: 210px;
  height: 190px;
  background: white;
  border-radius: 50%;
}

/* Eyes */
.eye {
  position: absolute;
  top: 35px;
  width: 48px;
  height: 58px;
  background: white;
  border: 3px solid #111;
  border-radius: 50%;
}

.eye.left {
  left: 60px;
}

.eye.right {
  right: 60px;
}

.pupil {
  position: absolute;
  width: 13px;
  height: 20px;
  background: #111;
  border-radius: 50%;
  bottom: 10px;
  left: 17px;
}

/* Nose */
.nose {
  position: absolute;
  top: 92px;
  left: 50%;
  transform: translateX(-50%);
  width: 28px;
  height: 28px;
  background: #e53935;
  border: 2px solid #111;
  border-radius: 50%;
}

/* Nose shine */
.nose::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 7px;
  background: white;
  border-radius: 50%;
  top: 5px;
  left: 6px;
}

/* Mouth */
.mouth {
  position: absolute;
  top: 125px;
  left: 50%;
  width: 80px;
  height: 55px;
  transform: translateX(-50%);
  border-bottom: 4px solid #111;
  border-radius: 50%;
}

/* Whiskers */
.whisker {
  position: absolute;
  width: 55px;
  height: 2px;
  background: #111;
}

.w1 { left: 5px; top: 110px; transform: rotate(10deg); }
.w2 { left: 5px; top: 125px; }
.w3 { left: 5px; top: 140px; transform: rotate(-10deg); }

.w4 { right: 5px; top: 110px; transform: rotate(-10deg); }
.w5 { right: 5px; top: 125px; }
.w6 { right: 5px; top: 140px; transform: rotate(10deg); }

/* Body */
.body {
  position: absolute;
  top: 205px;
  left: 25px;
  width: 200px;
  height: 115px;
  background: #159bd3;
  border: 4px solid #111;
  border-radius: 40px;
}

/* White belly */
.belly {
  position: absolute;
  left: 25px;
  top: 15px;
  width: 145px;
  height: 100px;
  background: white;
  border-radius: 50%;
}

/* Pocket */
.pocket {
  position: absolute;
  left: 45px;
  top: 45px;
  width: 105px;
  height: 55px;
  background: white;
  border: 3px solid #111;
  border-radius: 0 0 60px 60px;
}

/* Bell */
.bell {
  position: absolute;
  top: 195px;
  left: 105px;
  width: 50px;
  height: 35px;
  background: #ffd21c;
  border: 3px solid #111;
  border-radius: 50%;
  z-index: 5;
}

.bell::after {
  content: "";
  position: absolute;
  bottom: -7px;
  left: 20px;
  width: 8px;
  height: 8px;
  background: #111;
  border-radius: 50%;
}

/* Arms */
.arm {
  position: absolute;
  width: 65px;
  height: 35px;
  background: #159bd3;
  border: 4px solid #111;
  border-radius: 50%;
  top: 225px;
}

.arm.left {
  left: -20px;
  transform: rotate(25deg);
}

.arm.right {
  right: -20px;
  transform: rotate(-25deg);
}

/* Feet */
.foot {
  position: absolute;
  width: 75px;
  height: 35px;
  background: white;
  border: 4px solid #111;
  border-radius: 50%;
  bottom: -15px;
}

.foot.left {
  left: 25px;
}

.foot.right {
  right: 25px;
}

/* Anywhere Door */
.door {
  position: absolute;
  right: 7%;
  bottom: 90px;
  width: 100px;
  height: 180px;
  background: #e53935;
  border: 5px solid #111;
  border-radius: 10px;
  box-shadow: 8px 8px 0 #b71c1c;
  animation: doorMove 3s infinite alternate;
}

.door::before {
  content: "どこでもドア";
  position: absolute;
  top: 45%;
  left: 5px;
  right: 5px;
  text-align: center;
  color: white;
  font-weight: bold;
  font-size: 12px;
}

.knob {
  position: absolute;
  right: 12px;
  top: 50%;
  width: 12px;
  height: 12px;
  background: gold;
  border: 2px solid #111;
  border-radius: 50%;
}

@keyframes bounce {
  50% {
    transform: translateX(-50%) translateY(-12px);
  }
}

@keyframes doorMove {
  50% {
    transform: rotate(3deg);
  }
}

/* Title */
.title {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  color: #075b9e;
  font-size: 32px;
  text-shadow: 2px 2px white;
}
</style>
</head>

<body>

<div class="title">💙 Doraemon's World 💙</div>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<!-- Doraemon -->
<div class="doraemon">

  <div class="head">

    <div class="face">

      <div class="eye left">
        <div class="pupil"></div>
      </div>

      <div class="eye right">
        <div class="pupil"></div>
      </div>

      <div class="nose"></div>

      <div class="mouth"></div>

      <div class="whisker w1"></div>
      <div class="whisker w2"></div>
      <div class="whisker w3"></div>

      <div class="whisker w4"></div>
      <div class="whisker w5"></div>
      <div class="whisker w6"></div>

    </div>

  </div>

  <div class="body">
    <div class="belly"></div>
    <div class="pocket"></div>
  </div>

  <div class="bell"></div>

  <div class="arm left"></div>
  <div class="arm right"></div>

  <div class="foot left"></div>
  <div class="foot right"></div>

</div>

<!-- Anywhere Door -->
<div class="door">
  <div class="knob"></div>
</div>

<div class="ground"></div>

</body>
</html>
