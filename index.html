<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chhota Bheem World</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>🥭 Welcome to Dholakpur 🥭</h1>
        <p>The Amazing World of Chhota Bheem!</p>
    </header>


    <!-- Main Section -->
    <main>

        <section class="hero">

            <!-- Chhota Bheem Image -->
            <div class="character">
                <img src="images/chotabheem.jpg" alt="Chhota Bheem">
            </div>


            <!-- Information -->
            <div class="info">

                <h2>💪 Chhota Bheem</h2>

                <p>
                    Welcome to Dholakpur! 🌳
                    Bheem is ready for another exciting adventure.
                </p>

                <button onclick="giveLadoo()">
                    🍯 Give Bheem a Ladoo
                </button>

                <p id="message"></p>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>🌟 Welcome to the world of Dholakpur 🌟</p>
    </footer>


    <script>

        function giveLadoo() {

            document.getElementById("message").innerHTML =
                "😋 Yummy! Bheem ate the ladoo! 💪🔥";

        }

    </script>

</body>

</html>
